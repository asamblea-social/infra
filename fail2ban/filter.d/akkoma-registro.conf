# akkoma-registro.conf — creado el 2026-10-21 (asamblea.social)
# Intentos FALLIDOS de registro en Akkoma, leídos del access.log de lighttpd:
# POST /api/v1/accounts con 400 (captcha u otro dato incorrecto) o 429 (límite).
# Una persona falla 0-2 veces; los bots de octubre fallaron 22 y 58 veces.
# No cuenta registros exitosos ni creación de apps (talleres desde una misma red).
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "POST /api/v1/accounts(?:\?\S*)? HTTP/[0-9.]+" (?:400|429) 
ignoreregex =
