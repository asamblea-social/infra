# akkoma-login.conf — creado el 2026-10-21 (asamblea.social)
# Inicios de sesión FALLIDOS en Akkoma (POST /oauth/token con 400/401/403),
# leídos del access.log de lighttpd. Sustituye al filtro pleroma.conf, que
# buscaba la IP en el journal de Akkoma, donde no aparece.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "POST /oauth/token(?:\?\S*)? HTTP/[0-9.]+" (?:400|401|403) 
ignoreregex =
